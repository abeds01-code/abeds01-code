<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Abed Sultan — Practical Software Engineering Student. Building useful software and future products.">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111c31"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56e0df"/><stop offset="1" stop-color="#7c83ff"/></linearGradient>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#6e87aa" stroke-opacity=".10"/></pattern>
 <clipPath id="frame"><rect width="1100" height="340" rx="22"/></clipPath>
 <style>
 .orbit{transform-origin:875px 170px;animation:spin 24s linear infinite}.orbit2{transform-origin:875px 170px;animation:spin 33s linear infinite reverse}.pulse{animation:pulse 3.4s ease-in-out infinite}.blink{animation:blink 1.15s steps(1) infinite}.line{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 3s ease forwards}.fade{animation:fade 1.4s ease both}.late{animation-delay:.45s}.later{animation-delay:.9s}
 @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}}
 </style>
</defs>
<g clip-path="url(#frame)">
<rect width="1100" height="340" fill="url(#bg)"/><rect width="1100" height="340" fill="url(#grid)"/>
<path d="M0 0H1100" stroke="url(#accent)" stroke-width="5"/>
<circle cx="875" cy="170" r="135" fill="#58d6df" opacity=".025"/>
<circle class="orbit" cx="875" cy="170" r="112" fill="none" stroke="#56e0df" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="170 28 18 40 5 440"/>
<circle class="orbit2" cx="875" cy="170" r="85" fill="none" stroke="#8991ff" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="40 55 90 45 12 300"/>
<circle cx="875" cy="170" r="59" fill="#17273b" stroke="#344e6c"/>
<path d="M848 170l-14 0 13-15m-13 15 13 15M902 170h14l-13-15m13 15-13 15" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M880 149l-12 42" stroke="#e1ecf9" stroke-width="4" stroke-linecap="round"/>
<circle class="pulse" cx="875" cy="58" r="5" fill="#56e0df"/><circle class="pulse" cx="960" cy="170" r="4" fill="#8d91ff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="57" y="57" font-size="14" letter-spacing="4" fill="#61d9d9">PORTFOLIO / 2026</text>
<text class="fade" x="54" y="136" font-size="66" font-weight="800" letter-spacing="-2" fill="#f5f8ff">ABED SULTAN</text>
<path class="line" d="M57 153H318" stroke="url(#accent)" stroke-width="4"/>
<text class="fade late" x="57" y="196" font-size="23" fill="#c9d7e9">Practical Software Engineering Student</text>
<text class="fade later" x="57" y="232" font-size="17" fill="#91a7c2">Ariel University  /  Software Development  /  AI Automation</text>
<rect x="56" y="270" width="391" height="38" rx="8" fill="#17263a" stroke="#2d4965"/>
<circle class="pulse" cx="78" cy="289" r="5" fill="#5ce2b2"/>
<text x="94" y="295" font-size="13" font-family="monospace" letter-spacing="1" fill="#d6e8f7">LEARNING  ·  BUILDING  ·  EVOLVING</text>
<rect class="blink" x="430" y="280" width="2" height="17" fill="#56e0df"/>
<text x="1043" y="313" font-size="12" text-anchor="end" fill="#718aa6" letter-spacing="2">SYSTEM / 01</text>
</g></g></svg>
